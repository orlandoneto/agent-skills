name: crawl-daily

on:
  schedule:
    # ~08:00 America/Sao_Paulo (11:00 UTC) — 1x/dia
    - cron: "0 11 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  crawl:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Radar only (staging)
        run: npm run crawl
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Commit staging candidates (not published skills)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add staging/
          if git diff --staged --quiet; then
            echo "Sem mudanças em staging/"
            exit 0
          fi
          git commit -m "chore: staging skill candidates (radar only)"
          git push
